<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEJAHUNT</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:linear-gradient(135deg,#0f766e,#14532d);

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;

            overflow:hidden;
        }

        .container{

            background:white;

            width:500px;

            padding:50px;

            border-radius:20px;

            text-align:center;

            box-shadow:0 20px 50px rgba(0,0,0,.3);

            animation:fadeIn 1.2s ease;
        }

        h1{

            color:#14532d;

            margin-bottom:15px;

            font-size:40px;

            animation:slideDown 1s ease;
        }

        p{

            color:#555;

            font-size:18px;

            margin-bottom:35px;
        }

        button{

            width:100%;

            padding:15px;

            margin-top:15px;

            border:none;

            border-radius:10px;

            font-size:18px;

            cursor:pointer;

            transition:.3s;
        }

        .register{

            background:#16a34a;

            color:white;
        }

        .register:hover{

            background:#15803d;

            transform:scale(1.05);
        }

        .login{

            background:#2563eb;

            color:white;
        }

        .login:hover{

            background:#1d4ed8;

            transform:scale(1.05);
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        @keyframes slideDown{

            from{
                transform:translateY(-50px);
                opacity:0;
            }

            to{
                transform:translateY(0);
                opacity:1;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1 id="title">🏠 KEJAHUNT</h1>

    <p>Your smart house-hunting platform in Kenya.</p>

    <a href="/register">
        <button class="register">
            Create Account
        </button>
    </a>

    <a href="/login">
        <button class="login">
            Login to Dashboard
        </button>
    </a>

</div>

<script>

const title = document.getElementById("title");

setInterval(function(){

    title.style.transform="scale(1.05)";

    setTimeout(function(){

        title.style.transform="scale(1)";

    },300);

},2500);

</script>

</body>
</html>
