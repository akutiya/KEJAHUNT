<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Landlord Inbox - KEJAHUNT</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f7fb;
}

/* ================= NAVBAR ================= */

nav{

    background:#14532d;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 40px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);

}

.logo{

    font-size:28px;
    font-weight:bold;

}

nav ul{

    display:flex;
    list-style:none;

}

nav ul li{

    margin-left:25px;

}

nav ul li a{

    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;

}

nav ul li a:hover{

    color:#fde047;

}

/* ================= CONTENT ================= */

.container{

    width:90%;
    max-width:1000px;
    margin:40px auto;

}

.title{

    color:#14532d;
    margin-bottom:30px;

}

/* ================= MESSAGE CARD ================= */

.message{

    background:white;
    padding:25px;
    margin-bottom:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    transition:.3s;

}

.message:hover{

    transform:translateY(-6px);

}

.message h3{

    color:#14532d;
    margin-bottom:15px;

}

.message p{

    color:#555;
    margin:10px 0;

}

.reply{

    display:inline-block;
    margin-top:15px;
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:12px 22px;
    border-radius:8px;
    transition:.3s;

}

.reply:hover{

    background:#1d4ed8;

}

/* ================= EMPTY ================= */

.empty{

    text-align:center;
    color:#777;
    font-size:20px;
    margin-top:80px;

}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

nav{

    flex-direction:column;

}

nav ul{

    flex-direction:column;
    margin-top:15px;

}

nav ul li{

    margin:10px 0;

}

}

</style>

</head>

<body>

<nav>

<div class="logo">

🏠 KEJAHUNT

</div>

<ul>

<li>
<a href="/">Home</a>
</li>

<li>
<a href="/landlord_dashboard">Dashboard</a>
</li>

<li>
<a href="/my_properties">My Listings</a>
</li>

<li>
<a href="/logout">Logout</a>
</li>

</ul>

</nav>

<div class="container">

<h1 class="title">

📥 Landlord Inbox

</h1>

{% for m in messages %}

<div class="message">

<h3>

👤 {{ m.sender.username }}

</h3>

<p>

<b>Property:</b>

{{ m.property.title }}

</p>

<p>

{{ m.message }}

</p>

<a class="reply" href="/reply/{{ m.id }}">

Reply

</a>

</div>

{% else %}

<div class="empty">

📭 No messages yet.

</div>

{% endfor %}

</div>

<script>

const cards=document.querySelectorAll(".message");

cards.forEach(function(card){

card.addEventListener("mouseenter",function(){

this.style.boxShadow="0 18px 35px rgba(0,0,0,.25)";

});

card.addEventListener("mouseleave",function(){

this.style.boxShadow="0 8px 20px rgba(0,0,0,.12)";

});

});

</script>

</body>
</html>
